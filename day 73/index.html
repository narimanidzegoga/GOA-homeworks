<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="div1">
    <h1 class="title">Password Generator</h1>

    <div class="password">
      <div class="text">PTx1f5DaFX</div>
      <button class="copy1">
        <img class="copy2" src="./assets/icon-copy.svg" alt="copy">
      </button>
    </div>

    <div class="div4">
      <div class="length-row">
        <div class="length-label">Character Length</div>
        <div class="length-value">10</div>
      </div>
      <div class="line"></div>
      
      <div class="checks">
        <div class="check-row">
          <div class="box1">
            <img class="check-img" src="./assets/icon-check.svg" alt="check">
          </div>
          <div class="check-text">Include Uppercase Letters</div>
        </div>
        <div class="check-row">
          <div class="box1">
            <img class="check-img" src="./assets/icon-check.svg" alt="check">
          </div>
          <div class="check-text">Include Lowercase Letters</div>
        </div>
        <div class="check-row row-short">
          <div class="box1">
            <img class="check-img" src="./assets/icon-check.svg" alt="check">
          </div>
          <div class="check-text">Include Numbers</div>
        </div>
        <div class="check-row">
          <div class="box2"></div>
          <div class="check-text">Include Symbols</div>
        </div>
      </div>

      <div class="strength-box">
        <div class="strength-title">STRENGTH</div>
        <div class="strength-right">
          <div class="strength-rating">MEDIUM</div>
          <div class="bars">
            <div class="bar bar-filled"></div>
            <div class="bar bar-filled"></div>
            <div class="bar bar-filled"></div>
            <div class="bar bar-empty"></div>
          </div>
        </div>
      </div>

      <button class="btn">
        <span class="btn-text">GENERATE</span>
        <img class="btn-arrow" src="./assets/icon-arrow-right.svg" alt="arrow">
      </button>
    </div>
  </div>

</body>
</html>
